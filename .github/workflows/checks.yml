name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same PR makes the older run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Keep the downloaded .debs so only a cache miss depends on the Ubuntu
      # mirror. Saved right after the install, not at job end, so a later
      # failing step cannot lose it.
      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-${{ hashFiles('.github/apt-packages.txt') }}
          restore-keys: apt-ubuntu-24.04-
      # The runner's Azure mirror serves indexes fast but packages sometimes at
      # ~40 kB/s, and apt only fails over on errors, not slowness. Use
      # Canonical's archive in its place.
      - name: Linux prerequisites
        timeout-minutes: 15
        run: |
          cat /etc/apt/apt-mirrors.txt
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|' /etc/apt/apt-mirrors.txt
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          xargs -a .github/apt-packages.txt sudo apt-get install -y \
            -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-archives"
          sudo chown -R "$USER" ~/apt-archives
      - name: Save apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-${{ hashFiles('.github/apt-packages.txt') }}
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/.nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Install cargo-deny and Tauri WebDriver bridge
        run: cargo install --locked cargo-deny && cargo install --locked tauri-driver --version 2.0.5
      - name: Rust, dependency policy, frontend, native build and desktop metadata
        run: scripts/check.sh
      # Ubuntu 24.04 runners block unprivileged user namespaces via AppArmor;
      # WebKitGTK needs them for its web-process sandbox. CI-only; the app and
      # its sandbox are unchanged.
      - name: Allow WebKitGTK sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Desktop and real IPC smoke test
        working-directory: apps/desktop
        run: xvfb-run -a npm run test:desktop
      - name: Development desktop launch
        working-directory: apps/desktop
        run: xvfb-run -a npm run test:dev
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lyra-linux
          path: |
            artifacts/
            target/debug/bundle/deb/*.deb
