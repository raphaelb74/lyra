[package]
name = "lyra-desktop"
description = "Lyra desktop shell: Tauri adapter between the Svelte UI and the Rust engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "lyra_desktop_lib"

[features]
# Set by `tauri build`: serve the bundled frontend instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# MPRIS (media keys); already in the tree through audio-alsa.
dbus.workspace = true
# Album cover thumbnails; already in the tree through GTK (Tauri on Linux).
gdk-pixbuf = "0.18"
audio-alsa = { workspace = true }
format-dsd = { workspace = true }
format-pcm = { workspace = true }
library = { workspace = true }
musicbrainz = { workspace = true }
unda = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
